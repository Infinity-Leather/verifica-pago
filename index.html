<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Pagos Yape</title>
  <style>
    :root {
      --bg-dark: #12100f;
      --card-bg: #1c1917;
      --border-color: #362f2a;
      --gold: #c59b6d;
      --gold-hover: #d4af84;
      --yape-purple: #742384;
      --text-main: #f5f2eb;
      --text-muted: #a69c92;
      --success: #4ade80;
      --warning: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 26px 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .header-badges {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge-yape {
      background: var(--yape-purple);
      color: #fff;
    }

    .badge-gold {
      background: rgba(197, 155, 109, 0.15);
      color: var(--gold);
      border: 1px solid rgba(197, 155, 109, 0.35);
    }

    h1 {
      font-size: 1.45rem;
      margin-bottom: 6px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    /* Tarjeta individual de cada pago (1 a 5) */
    .payment-item {
      background: #141210;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
    }

    .payment-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #26211e;
    }

    .payment-number {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
    }

    .btn-remove {
      background: rgba(248, 113, 113, 0.15);
      color: #f87171;
      border: 1px solid rgba(248, 113, 113, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .field-group {
      margin-bottom: 12px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="number"],
    input[type="time"] {
      width: 100%;
      padding: 11px 12px;
      background: #1c1917;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
    }

    /* Subida de captura con vista previa */
    .upload-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1c1917;
      border: 1px dashed #4a4039;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .preview-thumb {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: #26211e;
      object-fit: cover;
      display: none;
      border: 1px solid var(--gold);
    }

    .upload-text {
      font-size: 0.85rem;
      color: var(--gold);
      font-weight: 600;
    }

    /* Barra de acciones: Agregar pago + Resumen */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-add {
      background: transparent;
      color: var(--gold);
      border: 1px dashed var(--gold);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .total-counter {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .total-counter strong {
      color: #fff;
      font-size: 1.1rem;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: #141210;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--gold-hover);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Sección de resultados de confirmación */
    .confirmation-box {
      display: none;
      margin-top: 22px;
      background: #141210;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
    }

    .conf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #292421;
    }

    .result-row {
      padding: 12px;
      background: #1c1917;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid var(--gold);
    }

    .result-row.ok {
      border-left-color: var(--success);
    }

    .result-row.pending {
      border-left-color: var(--warning);
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .result-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-badges">
      <span class="badge badge-yape">Yape / BCP</span>
      <span class="badge badge-gold">Hasta 5 pagos por enlace</span>
    </div>

    <h1>Confirmación de Pago</h1>
    <p class="subtitle">Sube la captura de tu Yape e ingresa el nombre exacto de la persona que abonó, el importe y la hora que figura en el voucher.</p>

    <!-- Contenedor donde se insertan de 1 a 5 bloques de pago -->
    <div id="pagosContainer"></div>

    <div class="actions-bar">
      <button type="button" class="btn-add" id="btnAddPago" onclick="agregarBloquePago()">
        + Agregar otro abono (1/5)
      </button>
      <div class="total-counter">
        Total declarado: <strong id="sumaTotal">S/ 0.00</strong>
      </div>
    </div>

    <button type="button" class="btn-submit" id="btnValidar" onclick="enviarValidacion()">
      Validar y Confirmar Pagos
    </button>

    <!-- Resultado de la confirmación -->
    <div class="confirmation-box" id="confirmationBox">
      <div class="conf-header">
        <strong>Resultado de la Verificación</strong>
        <span id="totalConfirmadoBadge" style="color: var(--success); font-weight: 700;"></span>
      </div>
      <div id="listaResultados"></div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1QFvB70Yoef37iFU_LGpK937UBb2-xMC3gbjkQ8jLfxdFwt8PPMQai8Y4ITPsgYsX/exec";

    const MAX_PAGOS = 5;
    let contadorBloques = 0;

    // Al abrir la página, creamos automáticamente el Pago #1
    window.addEventListener("DOMContentLoaded", () => {
      agregarBloquePago();
    });

    function agregarBloquePago() {
      const container = document.getElementById("pagosContainer");
      const totalActual = container.querySelectorAll(".payment-item").length;

      if (totalActual >= MAX_PAGOS) return;

      contadorBloques++;
      const idUnico = contadorBloques;

      const div = document.createElement("div");
      div.className = "payment-item";
      div.dataset.id = idUnico;

      div.innerHTML = `
        <div class="payment-item-header">
          <span class="payment-number">Abono #<span class="num-orden">${totalActual + 1}</span></span>
          ${totalActual > 0 ? `<button type="button" class="btn-remove" onclick="eliminarBloque(this)">✕ Quitar</button>` : ""}
        </div>

        <div class="field-group">
          <label>Nombre completo del titular que yapeó</label>
          <input type="text" class="input-nombre" placeholder="Ej: Juan Carlos Pérez" required>
        </div>

        <div class="field-row">
          <div>
            <label>Importe exacto (S/)</label>
            <input type="number" step="0.01" min="0.10" class="input-monto" placeholder="Ej: 45.00" oninput="actualizarTotal()" required>
          </div>
          <div>
            <label>Hora del pago</label>
            <input type="time" class="input-hora" required>
          </div>
        </div>

        <div class="field-group" style="margin-bottom: 0;">
          <label>Captura del voucher de pago</label>
          <label class="upload-box">
            <img class="preview-thumb" id="thumb_${idUnico}" alt="Vista previa">
            <span class="upload-text" id="text_${idUnico}">📸 Toca para subir captura de Yape</span>
            <input type="file" accept="image/*" class="input-archivo" onchange="procesarImagen(this, ${idUnico})">
          </label>
        </div>
      `;

      container.appendChild(div);
      actualizarNumeracionYBoton();
    }

    function eliminarBloque(btn) {
      btn.closest(".payment-item").remove();
      actualizarNumeracionYBoton();
      actualizarTotal();
    }

    function actualizarNumeracionYBoton() {
      const items = document.querySelectorAll(".payment-item");
      items.forEach((item, index) => {
        item.querySelector(".num-orden").innerText = index + 1;
      });

      const btnAdd = document.getElementById("btnAddPago");
      btnAdd.innerText = `+ Agregar otro abono (${items.length}/${MAX_PAGOS})`;
      btnAdd.disabled = items.length >= MAX_PAGOS;
    }

    function actualizarTotal() {
      let suma = 0;
      document.querySelectorAll(".input-monto").forEach(input => {
        const val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) suma += val;
      });
      document.getElementById("sumaTotal").innerText = `S/ ${suma.toFixed(2)}`;
    }

    // Comprime la captura de pantalla en el navegador para que suba rápido desde datos móviles
    function procesarImagen(inputFile, idUnico) {
      const file = inputFile.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 900;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const base64Comprimido = canvas.toDataURL("image/jpeg", 0.75);
          inputFile.dataset.base64 = base64Comprimido;
          inputFile.dataset.filename = file.name;

          const thumb = document.getElementById(`thumb_${idUnico}`);
          thumb.src = base64Comprimido;
          thumb.style.display = "block";
          document.getElementById(`text_${idUnico}`).innerText = "✓ Captura cargada (" + file.name.slice(0, 18) + ")";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function enviarValidacion() {
      const items = document.querySelectorAll(".payment-item");
      const listaPagos = [];

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const nombre = item.querySelector(".input-nombre").value.trim();
        const monto = item.querySelector(".input-monto").value.trim();
        const hora = item.querySelector(".input-hora").value.trim();
        const fileInput = item.querySelector(".input-archivo");
        const base64 = fileInput.dataset.base64 || "";

        if (!nombre || !monto || !hora || !base64) {
          alert(`Por favor completa todos los datos y sube la captura en el Abono #${i + 1}.`);
          return;
        }

        listaPagos.push({
          nombre: nombre,
          monto: parseFloat(monto).toFixed(2),
          hora: hora,
          imagenBase64: base64,
          nombreArchivo: fileInput.dataset.filename || `voucher_${i + 1}.jpg`
        });
      }

      const btn = document.getElementById("btnValidar");
      const box = document.getElementById("confirmationBox");
      btn.disabled = true;
      btn.innerText = "Verificando abonos en sistema bancario...";
      box.style.display = "none";

      try {
        // Enviamos con text/plain para evitar bloqueo CORS desde GitHub
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ pagos: listaPagos })
        });

        const data = await response.json();
        mostrarConfirmacion(data);

      } catch (error) {
        alert("No se pudo conectar con el servidor de validación. Verifica que pegaste tu URL de Apps Script.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Validar y Confirmar Pagos";
      }
    }

    function mostrarConfirmacion(data) {
      const box = document.getElementById("confirmationBox");
      const contenedorLista = document.getElementById("listaResultados");
      const badgeTotal = document.getElementById("totalConfirmadoBadge");

      contenedorLista.innerHTML = "";

      if (!data.exito) {
        contenedorLista.innerHTML = `<p style="color:#f87171;">${data.mensaje}</p>`;
        box.style.display = "block";
        return;
      }

      badgeTotal.innerText = `Confirmado: S/ ${data.totalValidado}`;

      data.resultados.forEach(r => {
        const div = document.createElement("div");
        div.className = `result-row ${r.validado ? "ok" : "pending"}`;
        div.innerHTML = `
          <div class="result-top">
            <span>#${r.indice} - ${r.nombre} (S/ ${r.monto})</span>
            <span style="color: ${r.validado ? "#4ade80" : "#fbbf24"};">${r.estado}</span>
          </div>
          <div class="result-detail">
            Hora declarada: ${r.hora} | ${r.detalle}
          </div>
        `;
        contenedorLista.appendChild(div);
      });

      box.style.display = "block";
      box.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
